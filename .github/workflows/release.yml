# Pushing a tag like v0.1.0 builds nit for each platform on its own runner (fff's native
# library comes from the runner's optional package), then publishes:
#   - a GitHub release with nit-<os>-<arch>.tar.gz + .sha256 (install.sh downloads these)
#   - the formula in sidwebworks/homebrew-tap (needs HOMEBREW_TAP_TOKEN: a token that can push there)
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: macos-14, target: bun-darwin-arm64 }
          - { runner: macos-13, target: bun-darwin-x64 }
          - { runner: ubuntu-24.04, target: bun-linux-x64 }
          - { runner: ubuntu-24.04-arm, target: bun-linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: The tag matches package.json
        run: test "v$(bun -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: bun scripts/compile.ts ${{ matrix.target }}
      - run: dist/release/pkg/nit --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/release/nit-*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/nit-* --title "$GITHUB_REF_NAME" --generate-notes
      - name: Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          bun scripts/formula.ts dist/release > nit.rb
          gh repo clone sidwebworks/homebrew-tap tap
          mkdir -p tap/Formula && mv nit.rb tap/Formula/nit.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/nit.rb
          git commit -m "nit $GITHUB_REF_NAME"
          git push "https://x-access-token:${GH_TOKEN}@github.com/sidwebworks/homebrew-tap.git" HEAD
